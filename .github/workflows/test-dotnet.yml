          name: test-results-ubuntu
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-ubuntu
          path: '**/coverage.cobertura.xml'

      - name: Normalize coverage for Codecov
        shell: pwsh
